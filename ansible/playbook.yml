---
# Configure the app server(s) and deploy the Password Generator API:
#
#   ansible-playbook -i inventory playbook.yml
#
# The server starts bare (no Python, no Java). The pre-task installs Python over raw SSH so
# Ansible's modules can run; the passgen_app role then installs Java, copies the JAR built
# by Maven/Jenkins and runs it as a systemd service.

- name: Deploy the Password Generator API
  hosts: app_servers
  become: true
  gather_facts: false

  pre_tasks:
    - name: Bootstrap Python 3 on a bare host
      ansible.builtin.raw: >-
        if [ -x /usr/bin/python3 ]; then echo present;
        else export DEBIAN_FRONTEND=noninteractive && apt-get update -qq
        && apt-get install -y -qq python3 python3-apt >/dev/null && echo installed; fi
      register: python_bootstrap
      changed_when: "'installed' in python_bootstrap.stdout"

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - passgen_app

  post_tasks:
    - name: Smoke-test the API on the server
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/api/password/generate?length=20"
        return_content: true
      register: smoke
      failed_when: smoke.status != 200 or (smoke.json.password | length) != 20

    - name: Show a generated password
      ansible.builtin.debug:
        msg: "API answered on port {{ app_port }}: {{ smoke.json }}"
