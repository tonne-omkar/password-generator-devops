# One stable address for all passgen pods. The selector matches the pod label app=passgen,
# so whichever pods exist (3, 5, after a rollout...) receive the traffic.
# NodePort 30080 is mapped to http://localhost:8090 by kind/kind-config.yaml.
apiVersion: v1
kind: Service
metadata:
  name: passgen
  labels:
    app: passgen
spec:
  type: NodePort
  selector:
    app: passgen
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
