# CI enhancement: GitHub Actions runs the same Maven build as Jenkins on every push and
# pull request, on GitHub's own runners, so a PR shows a green check before it is merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test (JUnit + JaCoCo 80% gate)
        run: mvn -B clean test

      - name: Build versioned JAR
        run: mvn -B package -DskipTests -Dbuild.tag="gh${{ github.run_number }}-${GITHUB_SHA::7}"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: password-generator-api-jar
          path: target/*.jar

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
