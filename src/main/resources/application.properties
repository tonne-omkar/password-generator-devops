spring.application.name=password-generator-api
server.port=8081

# Shown by /api/password/health and the web page. Jenkins/Docker pass the build tag in APP_VERSION.
app.version=${APP_VERSION:@build.tag@}

# Password length limits. Kubernetes overrides these from the ConfigMap (PASSGEN_MAX_LENGTH etc.).
passgen.min-length=8
passgen.max-length=64

# Actuator: health (with Kubernetes liveness/readiness groups), info and Prometheus metrics.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.info.git.mode=simple
management.info.env.enabled=true
info.app.name=Password Generator API
info.app.version=${app.version}

# Finish in-flight requests before the process stops (rolling updates, scale-down).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
