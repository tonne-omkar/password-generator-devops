# Jenkins Configuration as Code: the admin user and the pipeline job are version-controlled
# here instead of being clicked together in the UI.
jenkins:
  systemMessage: "Password Generator API - DevOps PBL"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin123}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: |
      pipelineJob('password-generator-api') {
        displayName('Password Generator API')
        description('Test (JUnit + JaCoCo gate), build a versioned JAR and archive it. Polls GitHub every minute.')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM {
                scmpoll_spec('* * * * *')
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${REPO_URL:-https://github.com/tonne-omkar/password-generator-devops.git}')
                }
                branch('${REPO_BRANCH:-*/main}')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
